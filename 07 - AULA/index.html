<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1> TRANALHO COM INPUTS</h1>
    </header>

    <!-- INPUTS -->
    <main>
        <h2> Formulario de cadastro </h2>
    
        <!-- INPUT - COLETA DE INFORMAÇÕES -->
        <!-- FORM - ENGLOBA OS CAMPOS DO FORMULARIO -->
        <!-- ACTION - PARA ONDE VÃO AS INFORMAÇÕES PREENCHIDAS -->
        <!-- METHOD - FORMA DE COMO VÃO AS INFORMAÇÕES -->
        <form action="" method="">

            <!-- LABEL - TEXTO DE APOIO PRA GULAR O INPUT -->
            <!-- FORMA 1 - LABEL SEM INPUT  -->
            <label for="NomeCompleto"> Nome: </label>
            <!-- TEXT - CARACTERES EM GERAK -->
            <!-- NAME - USADO PARA IDENTIFICAR O INPUT QUANDO ENVIAR OS DADOS -->
            <!-- ID - IDENTIFICAÇÃO DAQUELE HTML -->
            <input type="text" name="NomeCompleto" id="NomeCompleto">

            <br></br>

            <!-- INPUT DENTRO DO LABEL -->
             <label for="Senha">
                Senha
                <!-- PASSWORD - SENHAR -->
                <input type="password" name="Senha" id="Senha">
             </label>
        </form>
    </main>


    <footer>
        <p> DIREITOS SÃO MEUS, POIS FOI EU QUEM FEZ </p>
    </footer>
</body>
</html>
