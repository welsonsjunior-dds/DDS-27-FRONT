<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- TABELAS -->
    <header>
        <h1> Tabelas top's </h1>
    </header>

    <main>
        <h2>  JOGADORES  </h2>
        <!-- TABLE - CRIAÇÃO DA TABELA -->
        <!-- BORDER - PROPRIEDADES DE BORDA DA TABELA -->
        <table border="5">
            <!-- THEAD - CABEÇALHO DA TABELA -->
             <thead>
                <!-- TR - CRIAÇÃO DE UMA LINHA -->
                <tr>
                    <!-- TH - COLUNA DE UM CABEÇALHO -->
                    <th>ID</th>
                    <th>NOME</th>
                    <th>NUMERO</th>
                    <th>CLUBE</th>
                    <th>PAIS</th>
                </tr>
             </thead>
             <!-- CRIAÇÃO DO CORPO DA TABELA -->
             <!-- TBODY = CORPO DA TABELA -->
              <tbody>
                <tr>
                    <!-- TD - CÉLULA DA LINHA DO CORPO -->
                    <td>01</td>
                    <td>Pessi</td>
                    <td>10</td>
                    <td>Barsemlona</td>
                    <td>Ar,rentina</td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>Lepé</td>
                    <td>10</td>
                    <td>Santastico</td>
                    <td>Braza</td>
                </tr>
                <tr>
                    <td>03</td>
                    <!-- COLDSPAN - DIZ QUANTAS COLUNAS A CÉLULA VAI OCUPAR -->
                    <td colspan="3">NeymarJr</td>
                    <!-- ROWSPAN - DIZ QUANTAS LINHA A CÉLULA VAI OCUPAR -->
                    <td rowspan="2">11</td>
                </tr>
                <tr>
                    <td> 04</td>
                    <td>Lamal</td>
                    <td>19</td>
                    <td>Marrocos</td>
                </tr>
              </tbody>
              <!-- TFOOT - RODAPÉ DA TABELA -->
               <tfoot>
                <tr>
                    <td colspan ="5"> tabela feita por Welson</td>
                </tr>
               </tfoot>
        </table>
    </main>

    <footer>
        <p> Segue nóis </p>
    </footer>
</body>
</html>
